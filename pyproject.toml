[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ballistic-trajectory-simulator"
version = "0.1.0"
description = "Three-dimensional ballistics with drag, wind shear, Coriolis deflection, and a launch solution search."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "anismabaziz" }]
keywords = ["ballistics", "trajectory", "physics", "simulation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "pygame==2.6.1",
    "scipy==1.17.1",
]

[tool.setuptools]
py-modules = ["config", "physics", "targets", "utils"]

[tool.setuptools.packages.find]
include = ["sim*"]
