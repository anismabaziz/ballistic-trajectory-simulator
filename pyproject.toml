[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ballistic-trajectory-simulator"
version = "0.1.0"
description = "Three-dimensional ballistics with drag, wind shear, Coriolis deflection, and a launch solution search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "anismabaziz" }]
keywords = ["ballistics", "trajectory", "physics", "simulation"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

# Floors, not pins. uv.lock holds the exact versions the documented physics
# results were computed against.
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pillow>=12.1.1",
    "pygame>=2.6.1",
    "scipy>=1.17.1",
]

[dependency-groups]
# uv installs this group by default, so `uv sync` leaves a checkout ready to run
# the suite. `packaging` is named here because the packaging test imports it.
dev = ["packaging>=24.0", "pytest>=8.0"]

[tool.setuptools]
py-modules = ["targets", "utils"]

[tool.setuptools.packages.find]
include = ["ballistics*", "sim*"]
